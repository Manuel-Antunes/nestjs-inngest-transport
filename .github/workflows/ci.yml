name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types and exports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: publint and attw
        run: pnpm check:exports

  test:
    name: Unit and integration — Node ${{ matrix.node }}, NestJS ${{ matrix.nest }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        nest: [11, 12]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The lockfile pins NestJS 12; the 11 leg swaps every @nestjs package for its latest 11.x,
      # which is the oldest major the peer range promises.
      - name: Use NestJS ${{ matrix.nest }}
        if: matrix.nest != 12
        run: >
          pnpm add --save-dev
          @nestjs/common@^${{ matrix.nest }}
          @nestjs/core@^${{ matrix.nest }}
          @nestjs/microservices@^${{ matrix.nest }}
          @nestjs/platform-express@^${{ matrix.nest }}
          @nestjs/platform-fastify@^${{ matrix.nest }}
          @nestjs/testing@^${{ matrix.nest }}
      - run: pnpm test:coverage
      - name: Upload coverage
        if: matrix.node == 24 && matrix.nest == 12
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

  e2e:
    name: End to end — Inngest dev server, NestJS ${{ matrix.nest }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nest: [11, 12]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Use NestJS ${{ matrix.nest }}
        if: matrix.nest != 12
        run: >
          pnpm add --save-dev
          @nestjs/common@^${{ matrix.nest }}
          @nestjs/core@^${{ matrix.nest }}
          @nestjs/microservices@^${{ matrix.nest }}
          @nestjs/platform-express@^${{ matrix.nest }}
          @nestjs/platform-fastify@^${{ matrix.nest }}
          @nestjs/testing@^${{ matrix.nest }}
      - run: docker pull inngest/inngest:latest
      - run: pnpm test:e2e

  package:
    name: Packed tarball — CommonJS and ESM consumers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:package
